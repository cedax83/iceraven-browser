# Runs the tests of the shortcuts area and the linters on the shortcut-reorder branch, and reports the problems as
# annotations, which can be read through the API when the logs can't be downloaded.
name: Test shortcut reorder

on:
  workflow_dispatch:
  push:
    branches:
      - shortcut-reorder

permissions:
  contents: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      # Merges from Firefox left some test files that are not valid Kotlin, and the project's CI never compiles them.
      # Only what these tests need is compiled here.
      - name: Keep only the tests of this area
        run: |
          cd app/src/test/java/org/mozilla/fenix
          find . -name '*.kt' -not -path './helpers/*' -not -path './home/topsites/*' \
            -not -path './home/SessionControlInteractorTest.kt' \
            -not -path './components/menu/fake/*' -delete
          rm -f home/topsites/ShortcutMenuItemProviderTest.kt
          find . -type f | wc -l

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g"
        shell: bash
        run: |
          set -o pipefail
          ./gradlew app:testForkReleaseUnitTest -PtestBuildType=forkRelease --no-daemon --continue \
            --tests 'org.mozilla.fenix.home.topsites.*' \
            --tests 'org.mozilla.fenix.home.SessionControlInteractorTest' \
            2>&1 | tee gradle.log || {
            bash .github/report-gradle-failure.sh gradle.log
            exit 1
          }

      - name: Report the test results
        if: always()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          lines = []
          for path in glob.glob("gradle/build/**/test-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      failed += 1
                      message = (problem.get("message") or problem.text or "")[:300]
                      lines.append(f"{case.get('classname').split('.')[-1]}: {case.get('name')}: {message}")
          text = "\n".join(lines)[:6000].replace("%", "%25").replace("\n", "%0A").replace("::", ": :")
          print(f"::notice title=Test results::{total} tests, {failed} failed")
          if lines:
              print(f"::error title=Failed tests::{text}")

      # The deletion above also keeps the broken test files out of the formatter.
      - name: Formatting
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ./gradlew app:ktfmtFormat --no-daemon > ktfmt.log 2>&1 || bash .github/report-gradle-failure.sh ktfmt.log
          git diff -- app/src/main/java/org/mozilla/fenix/home/topsites app/src/test/java/org/mozilla/fenix/home/topsites/TopSitesReorderTest.kt \
            app/src/test/java/org/mozilla/fenix/home/topsites/TopSitesOrderTest.kt > ktfmt.diff
          echo "::notice title=ktfmt::$(wc -l < ktfmt.diff) lines of diff"
          gh release view ci-results >/dev/null 2>&1 || gh release create ci-results --prerelease --title "CI results" --notes "Temporary" --target "$GITHUB_SHA"
          gh release upload ci-results ktfmt.diff --clobber
          git checkout -- app/src/main

      - name: Detekt
        if: always()
        shell: bash
        run: |
          ./gradlew app:detekt --no-daemon > detekt.log 2>&1 || bash .github/report-gradle-failure.sh detekt.log
          grep -E "TopSite|Shortcuts|topsites/|utils/Settings.kt|Components.kt" detekt.log | sed -e 's/%/%25/g' -e 's/::/: :/g' | head -25 > detekt.txt || true
          echo "::notice title=detekt::$(grep -cE 'detekt|\.kt:[0-9]+' detekt.log) lines, $(wc -l < detekt.txt) about these files"
          msg=$(awk 'BEGIN{ORS="%0A"} {print}' detekt.txt)
          [ -s detekt.txt ] && echo "::warning title=detekt::${msg:0:6000}"
          exit 0
